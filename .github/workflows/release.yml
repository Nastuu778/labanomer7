name: 'C++ CI'

on:
  push:
    branches:
      - lab7

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      release_version: ${{ steps.get_version.outputs.commit_count }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get commit count
        id: get_version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.1.${{ steps.get_version.outputs.commit_count }}
          release_name: Release v1.1.${{ steps.get_version.outputs.commit_count }}
          draft: false
          prerelease: false

  build-linux:
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          fetch-depth: 0

      - name: Install Boost dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-filesystem-dev libboost-program-options-dev libboost-system-dev cmake g++

      - name: Configure and Build
        run: |
          cmake -B build -DCOMMIT_COUNT=${{ needs.create-release.outputs.release_version }} -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Create Linux Archive
        run: |
          cd build
          tar -czf duplicate_finder-linux.tar.gz duplicate_finder

      - name: Upload Linux Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./build/duplicate_finder-linux.tar.gz
          asset_name: duplicate_finder-linux-v1.1.${{ needs.create-release.outputs.release_version }}.tar.gz
          asset_content_type: application/gzip

  build-windows:
    runs-on: windows-latest
    needs: create-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          fetch-depth: 0

      - name: Install dependencies via vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.bat
          ./vcpkg/vcpkg install boost-filesystem boost-program-options boost-system:x64-windows

      - name: Configure and Build
        run: |
          cmake -B build ^
            -DCMAKE_TOOLCHAIN_FILE="vcpkg/scripts/buildsystems/vcpkg.cmake" ^
            -A x64 ^
            -DCOMMIT_COUNT=${{ needs.create-release.outputs.release_version }} ^
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          $version = "${{ needs.create-release.outputs.release_version }}"
          Compress-Archive -Path "build\Release\duplicate_finder.exe" -DestinationPath "duplicate_finder-windows-v1.1.$version.zip"

      - name: Upload Windows Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./duplicate_finder-windows-v1.1.${{ needs.create-release.outputs.release_version }}.zip
          asset_name: duplicate_finder-windows-v1.1.${{ needs.create-release.outputs.release_version }}.zip
          asset_content_type: application/zip